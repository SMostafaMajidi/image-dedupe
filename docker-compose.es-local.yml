# Local Elasticsearch only — for REL-DUP4 experiments.
# Does NOT connect to production. Host port 9201 → container 9200.
#
#   docker compose -f docker-compose.es-local.yml up -d
#   curl -s http://127.0.0.1:9201/
services:
  elasticsearch-local:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: image-dedupe-es-local
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=image-dedupe-local
    ports:
      - "${LOCAL_ES_PORT:-9201}:9200"
    volumes:
      - es_local_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

volumes:
  es_local_data:
