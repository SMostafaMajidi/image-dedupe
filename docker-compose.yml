services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: image-dedupe-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-dedupe-app
    ports:
      - "${APP_PORT:-3020}:8000"
    env_file:
      - .env
    environment:
      # Compose network hostname (must not be localhost)
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      COLLECTION_NAME: ${COLLECTION_NAME:-image_embeddings}
      CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-openai/clip-vit-base-patch32}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.90}
      DEDUPE_SIMILARITY_THRESHOLD: ${DEDUPE_SIMILARITY_THRESHOLD:-0.97}
      DEDUPE_HASH_MAX_DISTANCE: ${DEDUPE_HASH_MAX_DISTANCE:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache:
